<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-label="Android application flow: user draws four digits, an on-device classifier interprets them, local verification occurs, then failure handling or access decision."><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#264456" stroke-opacity=".22" stroke-width="1"/></pattern><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102838"/><stop offset="1" stop-color="#081827"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#183c4a"/><stop offset="1" stop-color="#142b3e"/></linearGradient></defs><rect width="1200" height="510" fill="url(#bg)"/><rect width="1200" height="510" fill="url(#grid)"/><circle cx="1020" cy="10" r="225" fill="#30c7be" fill-opacity=".05"/><text x="52" y="60" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.3" fill="#9ce6de">PUBLIC STUDENT PROJECT / APP FLOW</text><text x="52" y="103" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#e8f2f8">From drawn digit to access decision</text><text x="52" y="133" font-family="Arial,sans-serif" font-size="15" fill="#a5b9c6">An educational on-device recognition prototype using a four-digit PIN.</text><rect x="50" y="197" width="210" height="187" rx="16" fill="url(#card)" stroke="#46788a" stroke-width="1.3"/><rect x="66" y="215" width="39" height="32" rx="7" fill="#23716f" fill-opacity=".52"/><text x="85.5" y="236" fill="#9cf1e6" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">01</text><text x="67" y="282" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#e6f2f8">Draw digits</text><text x="67" y="315" font-family="Arial,sans-serif" font-size="15" fill="#b9d0de">Android touch UI</text><text x="67" y="337" font-family="Arial,sans-serif" font-size="15" fill="#b9d0de">Four-digit sequence</text><path d="M267 295 H338" fill="none" stroke="#91e5df" stroke-width="2.7"/><path d="M331 290L338 295L331 300" fill="none" stroke="#91e5df" stroke-width="2.7"/><rect x="347" y="197" width="210" height="187" rx="16" fill="url(#card)" stroke="#46788a" stroke-width="1.3"/><rect x="363" y="215" width="39" height="32" rx="7" fill="#23716f" fill-opacity=".52"/><text x="382.5" y="236" fill="#9cf1e6" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">02</text><text x="364" y="282" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#e6f2f8">Recognize input</text><text x="364" y="315" font-family="Arial,sans-serif" font-size="15" fill="#b9d0de">TensorFlow Lite</text><text x="364" y="337" font-family="Arial,sans-serif" font-size="15" fill="#b9d0de">MNIST digit model</text><path d="M564 295 H635" fill="none" stroke="#91e5df" stroke-width="2.7"/><path d="M628 290L635 295L628 300" fill="none" stroke="#91e5df" stroke-width="2.7"/><rect x="644" y="197" width="210" height="187" rx="16" fill="url(#card)" stroke="#46788a" stroke-width="1.3"/><rect x="660" y="215" width="39" height="32" rx="7" fill="#23716f" fill-opacity=".52"/><text x="679.5" y="236" fill="#9cf1e6" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">03</text><text x="661" y="282" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#e6f2f8">Verify locally</text><text x="661" y="315" font-family="Arial,sans-serif" font-size="15" fill="#b9d0de">Compare entered PIN</text><text x="661" y="337" font-family="Arial,sans-serif" font-size="15" fill="#b9d0de">Manage app state</text><path d="M861 295 H932" fill="none" stroke="#91e5df" stroke-width="2.7"/><path d="M925 290L932 295L925 300" fill="none" stroke="#91e5df" stroke-width="2.7"/><rect x="941" y="197" width="210" height="187" rx="16" fill="url(#card)" stroke="#46788a" stroke-width="1.3"/><rect x="957" y="215" width="39" height="32" rx="7" fill="#23716f" fill-opacity=".52"/><text x="976.5" y="236" fill="#9cf1e6" font-family="Arial,sans-serif" text-anchor="middle" font-size="15" font-weight="700">04</text><text x="958" y="282" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#e6f2f8">Handle failures</text><text x="958" y="315" font-family="Arial,sans-serif" font-size="15" fill="#b9d0de">Attempt counter</text><text x="958" y="337" font-family="Arial,sans-serif" font-size="15" fill="#b9d0de">Temporary lockout</text><path d="M52 435H1148" stroke="#487080" stroke-width="1" opacity=".75"/><circle cx="58" cy="463" r="5" fill="#88e7d9"/><text x="75" y="468" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#9ce6de">STUDENT DEMONSTRATION  ·  NOT PRODUCTION-GRADE AUTHENTICATION</text></svg>