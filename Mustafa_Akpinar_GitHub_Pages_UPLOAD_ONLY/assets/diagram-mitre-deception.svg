<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 610" width="1440" height="610" role="img" aria-labelledby="title desc">
<title id="title">Conceptual cyber deception and detection workflow</title>
<desc id="desc">An illustrative training diagram showing how a decoy might lead to a suspicious interaction, a detection signal and an analyst investigation. Not an actual employer architecture or deployment.</desc>
<defs>
 <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10293a"/><stop offset="1" stop-color="#081822"/></linearGradient>
 <linearGradient id="node" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#193c50"/><stop offset="1" stop-color="#132839"/></linearGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#326073" stroke-opacity=".21"/></pattern>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7fddd3"/></marker>
 <style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}.k{font-size:15px;font-weight:700;letter-spacing:3px;fill:#84ddd5}.h{font-size:34px;font-weight:760;fill:#e9faff}.s{font-size:17px;fill:#b0cbd8}.name{font-size:24px;font-weight:730;fill:#eef9fb}.caption{font-size:17px;fill:#bad3df}.id{font-size:15px;font-weight:800;fill:#a0eee5}.foot{font-size:14px;font-weight:700;letter-spacing:1.3px;fill:#93b4c4}.node{fill:url(#node);stroke:#416a7c;stroke-width:2}.wire{stroke:#7fddd3;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
</defs>
<rect width="1440" height="610" rx="25" fill="url(#background)"/>
<rect width="1440" height="610" rx="25" fill="url(#grid)"/>
<text x="62" y="66" class="k">MITRE CASE STUDY / CONCEPTUAL MODEL</text>
<text x="62" y="120" class="h">Cyber deception &amp; detection principles</text>
<text x="62" y="155" class="s">Illustrative security workflow — no employer systems or real configurations depicted.</text>
<g>
 <rect x="64" y="244" width="288" height="209" rx="20" class="node"/>
 <text x="88" y="279" class="id">01  /  DECOY</text><text x="88" y="331" class="name">Decoy surface</text><text x="88" y="365" class="caption">Hypothetical asset</text><text x="88" y="394" class="caption">designed to attract</text><text x="88" y="423" class="caption">unexpected activity</text>
 <rect x="400" y="244" width="288" height="209" rx="20" class="node"/>
 <text x="424" y="279" class="id">02  /  INTERACTION</text><text x="424" y="331" class="name">Suspicious access</text><text x="424" y="365" class="caption">An unanticipated</text><text x="424" y="394" class="caption">interaction could</text><text x="424" y="423" class="caption">produce an event</text>
 <rect x="736" y="244" width="288" height="209" rx="20" class="node"/>
 <text x="760" y="279" class="id">03  /  SIGNAL</text><text x="760" y="331" class="name">Detection signal</text><text x="760" y="365" class="caption">An indicator for</text><text x="760" y="394" class="caption">contextual review</text><text x="760" y="423" class="caption">and validation</text>
 <rect x="1072" y="244" width="304" height="209" rx="20" class="node"/>
 <text x="1096" y="279" class="id">04  /  RESPONSE</text><text x="1096" y="331" class="name">Analyst triage</text><text x="1096" y="365" class="caption">Investigate before</text><text x="1096" y="394" class="caption">drawing security</text><text x="1096" y="423" class="caption">conclusions</text>
 <path class="wire" d="M357 350H392"/><path class="wire" d="M693 350H728"/><path class="wire" d="M1029 350H1064"/>
</g>
<path d="M63 507H1376" fill="none" stroke="#3e6574" stroke-width="2"/>
<text x="65" y="551" class="foot">FICTIONAL DATA FLOW  ·  NOT A MITRE ARCHITECTURE  ·  NO INTERNAL DETAILS</text>
</svg>