  <linearGradient id="field" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#102637"/><stop offset="1" stop-color="#09151f"/></linearGradient>
  <linearGradient id="box" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#17364a"/><stop offset="1" stop-color="#122333"/></linearGradient>
