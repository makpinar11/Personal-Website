<title id="diagramTitle">Deception-to-investigation workflow</title><desc id="diagramDesc">How a generic deception event can become a triaged security signal. This is a hypothetical educational illustration and not any employer's actual architecture.</desc><text x="62" y="65" class="k">CONCEPTUAL CASE STUDY  /  ASTRAZENECA</text><text x="62" y="113" class="h">Deception-to-investigation workflow</text><text x="62" y="145" class="st">How a generic deception event can become a triaged security signal.</text><rect x="62" y="222" width="290" height="235" rx="17" class="node" stroke="#426979"/><rect x="82" y="243" rx="7" width="34" height="30" fill="#1b4b57"/><text x="92" y="264" class="num">01</text><text x="82" y="313" class="lab">Decoy interaction</text><text x="82" y="346" class="desc">A protected decoy is</text><text x="82" y="369" class="desc">touched or queried.</text><path class="wire" d="M357 337 L383 337"/><rect x="401" y="222" width="290" height="235" rx="17" class="node" stroke="#426979"/><rect x="421" y="243" rx="7" width="34" height="30" fill="#1b4b57"/><text x="431" y="264" class="num">02</text><text x="421" y="313" class="lab">Detection event</text><text x="421" y="346" class="desc">Security telemetry</text><text x="421" y="369" class="desc">captures the activity.</text><path class="wire" d="M696 337 L722 337"/><rect x="740" y="222" width="290" height="235" rx="17" class="node" stroke="#7ce0d3"/><rect x="760" y="243" rx="7" width="34" height="30" fill="#1b4b57"/><text x="770" y="264" class="num">03</text><text x="760" y="313" class="lab">XDR enrichment</text><text x="760" y="346" class="desc">Signals are grouped</text><text x="760" y="369" class="desc">with investigation context.</text><path class="wire" d="M1035 337 L1061 337"/><rect x="1079" y="222" width="290" height="235" rx="17" class="node" stroke="#426979"/><rect x="1099" y="243" rx="7" width="34" height="30" fill="#1b4b57"/><text x="1109" y="264" class="num">04</text><text x="1099" y="313" class="lab">Analyst triage</text><text x="1099" y="346" class="desc">SOC assesses risk</text><text x="1099" y="369" class="desc">and response priority.</text><path d="M62 540H1378" stroke="#315465" stroke-width="1.6"/><circle cx="70" cy="570" r="5" fill="#78e5d5"/><text x="87" y="575" class="k" style="font-size:11px;letter-spacing:1.4px">ILLUSTRATIVE ONLY · NO EMPLOYER SYSTEM DETAILS OR INTERNAL CONFIGURATIONS</text></svg>