  <style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif} .h{fill:#eaf7fa;font-size:32px;font-weight:750;letter-spacing:-1px}.st{fill:#9fb7c6;font-size:16px}.k{fill:#90ddd6;font-size:12px;font-weight:760;letter-spacing:2.4px}.lab{fill:#dfeef3;font-size:20px;font-weight:750}.desc{fill:#b5cdd8;font-size:15px}.num{fill:#7be1d4;font-size:14px;font-weight:750}.small{fill:#8ca8b8;font-size:14px}.wire{stroke:#82cfd0;stroke-width:3.2;fill:none;marker-end:url(#arr)}.softline{stroke:#3c6778;stroke-width:2;fill:none;stroke-dasharray:7 10}.node{fill:url(#box);stroke:#426979;stroke-width:1.5}.pill{fill:#173c50;stroke:#315d6a;stroke-width:1}</style>
