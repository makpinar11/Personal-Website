<title id="diagramTitle">Identity-federation trust boundaries</title><desc id="diagramDesc">Generic IAM assessment concepts across authentication, policy, and protected resources. This is a hypothetical educational illustration and not any employer's actual architecture.</desc><text x="62" y="65" class="k">CONCEPTUAL CASE STUDY  /  MITRE</text><text x="62" y="113" class="h">Identity-federation trust boundaries</text><text x="62" y="145" class="st">Generic IAM assessment concepts across authentication, policy, and protected resources.</text><rect x="62" y="188" width="386" height="300" rx="18" fill="#0e2432" fill-opacity=".65" stroke="#48778a" stroke-dasharray="8 10"/><text x="81" y="215" class="k" style="font-size:11px">IDENTITY DOMAIN</text><rect x="510" y="188" width="440" height="300" rx="18" fill="#0e2432" fill-opacity=".65" stroke="#48778a" stroke-dasharray="8 10"/><text x="529" y="215" class="k" style="font-size:11px">POLICY / TRUST BOUNDARY</text><rect x="1012" y="188" width="366" height="300" rx="18" fill="#0e2432" fill-opacity=".65" stroke="#48778a" stroke-dasharray="8 10"/><text x="1031" y="215" class="k" style="font-size:11px">APPLICATION DOMAIN</text><rect x="82" y="253" width="344" height="199" rx="17" class="node" stroke="#426979"/><rect x="102" y="274" rx="7" width="34" height="30" fill="#1b4b57"/><text x="112" y="295" class="num">01</text><text x="102" y="344" class="lab">Identity provider</text><text x="102" y="377" class="desc">Authenticates identity;</text><text x="102" y="400" class="desc">issues time-limited claims.</text><rect x="535" y="253" width="389" height="199" rx="17" class="node" stroke="#7ce0d3"/><rect x="555" y="274" rx="7" width="34" height="30" fill="#1b4b57"/><text x="565" y="295" class="num">02</text><text x="555" y="344" class="lab">Policy verification</text><text x="555" y="377" class="desc">Validates claims, context,</text><text x="555" y="400" class="desc">least-privilege decisions.</text><rect x="1030" y="253" width="329" height="199" rx="17" class="node" stroke="#426979"/><rect x="1050" y="274" rx="7" width="34" height="30" fill="#1b4b57"/><text x="1060" y="295" class="num">03</text><text x="1050" y="344" class="lab">Protected resource</text><text x="1050" y="377" class="desc">Authorizes permitted</text><text x="1050" y="400" class="desc">requests only.</text><path class="wire" d="M431 345 L518 345"/><path class="wire" d="M930 345 L1015 345"/><path d="M62 540H1378" stroke="#315465" stroke-width="1.6"/><circle cx="70" cy="570" r="5" fill="#78e5d5"/><text x="87" y="575" class="k" style="font-size:11px;letter-spacing:1.4px">GENERAL IAM PRINCIPLES ONLY · NOT A REAL FEDERATION DESIGN</text></svg>