<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-label="Access control at the data layer">
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#203D4B" stroke-width="1" opacity=".23"/></pattern><linearGradient id="panel" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#142C3A"/><stop offset="1" stop-color="#0A1B28"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#7DDBC9" stroke-width="1.8"/></marker></defs>
<rect width="1440" height="620" fill="#0A1926"/><rect width="1440" height="620" fill="url(#grid)"/>
<rect x="36" y="36" width="1368" height="548" rx="18" fill="url(#panel)" stroke="#2A5462" stroke-width="2"/>
<circle cx="85" cy="82" r="7" fill="#72D7C2"/><text x="112" y="88" font-family="Inter,Arial,sans-serif" font-weight="700" font-size="19" letter-spacing="3" fill="#78D5C9">02 / AUTHORIZATION MODEL</text>
<text x="85" y="145" font-family="Inter,Arial,sans-serif" font-weight="750" font-size="35" fill="#F0F8FA">Access control at the data layer</text>
<text x="85" y="181" font-family="Inter,Arial,sans-serif" font-size="17" fill="#ABC7D0">Conceptual summary of permission enforcement, not the application’s policy SQL.</text>
<rect x="80" y="241" width="285" height="120" rx="13" fill="#0C202E" stroke="#7DDAC8" stroke-opacity=".78" stroke-width="2"/><rect x="82" y="243" width="5" height="116" rx="2" fill="#7DDAC8"/><text x="222.5" y="286" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#F2FAFB">Regional user</text><text x="222.5" y="318" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#B1CAD1">Read shared / write own</text><rect x="444" y="241" width="285" height="120" rx="13" fill="#0C202E" stroke="#9FD2FD" stroke-opacity=".78" stroke-width="2"/><rect x="446" y="243" width="5" height="116" rx="2" fill="#9FD2FD"/><text x="586.5" y="286" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#F2FAFB">Authorization</text><text x="586.5" y="318" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#B1CAD1">Database-level RLS</text><rect x="807" y="241" width="285" height="120" rx="13" fill="#0C202E" stroke="#7DDAC8" stroke-opacity=".78" stroke-width="2"/><rect x="809" y="243" width="5" height="116" rx="2" fill="#7DDAC8"/><text x="949.5" y="286" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#F2FAFB">Protected data</text><text x="949.5" y="318" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle" fill="#B1CAD1">Region-bound writes</text><path d="M374 301L432 301" fill="none" stroke="#7DDAC8" stroke-width="3" marker-end="url(#arr)"/><path d="M740 301L796 301" fill="none" stroke="#7DDAC8" stroke-width="3" marker-end="url(#arr)"/><rect x="1122" y="251" width="215" height="100" rx="13" fill="#18333B" stroke="#668F9D"/><text x="1229" y="290" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#EDF6F8">Audit trail</text><text x="1229" y="322" text-anchor="middle" font-family="Arial" font-size="14" fill="#B2CAD1">Recorded changes</text><path d="M1097 301L1115 301" fill="none" stroke="#7DDAC8" stroke-width="3" marker-end="url(#arr)"/><rect x="430" y="405" width="670" height="84" rx="11" fill="#112936" stroke="#315966"/><text x="765" y="435" text-anchor="middle" font-family="Arial" font-size="20" fill="#91DCCB">Policy boundary</text><text x="765" y="464" text-anchor="middle" font-family="Arial" font-size="15" fill="#B9D0D7">Cross-region writes / unapproved access are rejected</text>
<text x="88" y="551" font-family="Inter,Arial,sans-serif" font-size="14" fill="#8CAAB5" letter-spacing="1.5">CONCEPTUAL ILLUSTRATION  /  SYNTHETIC CONTENT ONLY  /  NOT A PRODUCTION SYSTEM DIAGRAM</text>
</svg>