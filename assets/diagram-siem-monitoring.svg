<title id="diagramTitle">Security monitoring &amp; triage pipeline</title><desc id="diagramDesc">Illustrative path from security telemetry to analyst-oriented dashboards. This is a hypothetical educational illustration and not any employer's actual architecture.</desc><text x="62" y="65" class="k">CONCEPTUAL CASE STUDY  /  ASTRAZENECA</text><text x="62" y="113" class="h">Security monitoring &amp; triage pipeline</text><text x="62" y="145" class="st">Illustrative path from security telemetry to analyst-oriented dashboards.</text><rect x="62" y="214" width="285" height="239" rx="17" class="node" stroke="#426979"/><rect x="82" y="235" rx="7" width="34" height="30" fill="#1b4b57"/><text x="92" y="256" class="num">01</text><text x="82" y="305" class="lab">Event sources</text><text x="82" y="338" class="desc">Generic endpoint</text><text x="82" y="361" class="desc">security signals.</text><rect x="415" y="214" width="285" height="239" rx="17" class="node" stroke="#7ce0d3"/><rect x="435" y="235" rx="7" width="34" height="30" fill="#1b4b57"/><text x="445" y="256" class="num">02</text><text x="435" y="305" class="lab">Data processing</text><text x="435" y="338" class="desc">Normalize fields;</text><text x="435" y="361" class="desc">add event context.</text><rect x="768" y="214" width="285" height="239" rx="17" class="node" stroke="#426979"/><rect x="788" y="235" rx="7" width="34" height="30" fill="#1b4b57"/><text x="798" y="256" class="num">03</text><text x="788" y="305" class="lab">SIEM views</text><text x="788" y="338" class="desc">Dashboards and</text><text x="788" y="361" class="desc">detection summaries.</text><rect x="1121" y="214" width="258" height="239" rx="17" class="node" stroke="#426979"/><rect x="1141" y="235" rx="7" width="34" height="30" fill="#1b4b57"/><text x="1151" y="256" class="num">04</text><text x="1141" y="305" class="lab">Analyst review</text><text x="1141" y="338" class="desc">Validate trends;</text><text x="1141" y="361" class="desc">investigate alerts.</text><path class="wire" d="M352 337 L399 337"/><path class="wire" d="M705 337 L753 337"/><path class="wire" d="M1058 337 L1105 337"/><path d="M62 540H1378" stroke="#315465" stroke-width="1.6"/><circle cx="70" cy="570" r="5" fill="#78e5d5"/><text x="87" y="575" class="k" style="font-size:11px;letter-spacing:1.4px">FICTIONAL DATA FLOW · NO INTERNAL SOURCES, QUERIES, OR DASHBOARD SCREENSHOTS</text></svg>